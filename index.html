<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="calcBody">
        <div>
            <input type="text" id="display" />
        </div>

        <div class="allOperator">
            <div class="operator">
                <input type="button" value="+" onClick="NumOnClick('+')">
            </div>
            <div class="operator">
                <input type="button" value="-" onClick="NumOnClick('-')">
            </div>
            <div class="operator">
                <input type="button" value="x" onClick="NumOnClick('*')">
            </div>
            <div>
                <input type="button" value="÷" onClick="NumOnClick('/')">
            </div>
        </div>

        <div>
            <div>
                <div class="allOperator numsRow">
                    <div class="operator"><input type="button" value="7" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="8" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="9" onClick="NumOnClick(value)"></div>
                </div>
                <div class="allOperator numsRow">
                    <div class="operator"><input type="button" value="4" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="5" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="6" onClick="NumOnClick(value)"></div>
                </div>
                <div class="allOperator numsRow">
                    <div class="operator"><input type="button" value="1" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="2" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="3" onClick="NumOnClick(value)"></div>
                </div>
                <div class="allOperator numsRow">
                    <div class="operator zeroSign"><input type="button" value="0" onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="." onClick="NumOnClick(value)"></div>
                    <div class="operator"><input type="button" value="AC" id="AC_operator"
                            onClick="clearDisplayScreen()"></div>
                </div>
            </div>
            <div class="equalSign"><input type="button" value="=" onClick="calculate()"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
